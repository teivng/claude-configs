# science profile
#
# Scientific research workflow. Pulls in the K-Dense / Anthropic
# scientific-* skills that ship pre-installed on many Claude Code
# accounts. These skills are NOT redistributed in this repo (license
# preservation); the profile documents the names so a user can install
# them from their original sources.

description: |
  Scientific research: literature review, citation management, figure
  generation, manuscript writing. Most skills here are pre-installed on
  research-oriented Claude Code accounts; the profile lists names + the
  install path each ships from.

# These skills are NOT copied into this repo — they're externally maintained
# (most by K-Dense Inc. under MIT license, distributed via Anthropic's hosted
# skill collection). Install them from their original sources. The names
# below correspond to entries in ~/.claude/skills/ on a Claude Code install
# that already has them.
scientific_skills_referenced:
  - citation-management
  - literature-review
  - markitdown
  - pyzotero
  - research-lookup
  - scholar-evaluation
  - scientific-brainstorming
  - scientific-critical-thinking
  - scientific-schematics
  - scientific-slides
  - scientific-writing
  - generate-image

skills: []

plugins: []

hooks: []

claude_md_templates:
  - do-not-block.template.md
