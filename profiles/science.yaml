# science profile
#
# Scientific research workflow. Bundles the K-Dense scientific-* research
# skills plus the writing/humanizer skills, so a fresh clone installs them
# directly into ~/.claude/skills/. See skills/ATTRIBUTION.md for
# license/attribution (all MIT).

description: |
  Scientific research: literature review, citation management, figure
  generation, manuscript writing, plus AI-writing cleanup. All skills are
  bundled in this repo and installed into ~/.claude/skills/.

skills:
  - citation-management
  - literature-review
  - markitdown
  - scholar-evaluation
  - scientific-brainstorming
  - scientific-critical-thinking
  - scientific-schematics
  - scientific-slides
  - scientific-writing
  - humanizer
  - humanizer_academic
  - humanizer-v2

plugins: []

hooks: []

claude_md_templates:
  - do-not-block.template.md

# Skills referenced by some research workflows but NOT bundled here
# (not present in this repo; install from their original sources if needed):
#   pyzotero, research-lookup, generate-image
